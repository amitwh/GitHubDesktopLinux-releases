name: Mirror release

# Publishes a release that was built by the source repository into this
# binary-mirror repository.
#
# The source repository (amitwh/GitHubDesktopLinux) builds the artefacts and
# publishes them to a release in its own repository using its GITHUB_TOKEN.
# This workflow then copies that release's assets into an identically tagged
# release here, using *this* repository's GITHUB_TOKEN.
#
# No long-lived credential crosses the repository boundary: the source
# release is public, so its assets are fetched over plain HTTPS, and the only
# token involved is the short-lived, repository-scoped one this workflow
# already has. A fine-grained PAT with Contents:write on this repository
# would work too, but it would mean storing a credential that can outlive
# the run.
#
# Integrity: every asset is verified against the sha256 digest that the
# GitHub API reports for it before it is written into the packages
# directory, so only bytes that the API vouched for are ever published.
# The API response is fetched over TLS from api.github.com with the source
# repository hardcoded below, so the digest is as trustworthy as the API
# itself.
#
# Assets already present on the mirrored release are left alone — this
# workflow only adds and replaces, so a release that carries extra files
# keeps them.

on:
  workflow_dispatch:
    inputs:
      version:
        description:
          'Version to mirror, without the leading v (e.g. 3.6.7-fork1).'
        required: true
        type: string

permissions:
  contents: write

jobs:
  mirror:
    name: Mirror release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Fetch and verify the source release
        id: source
        env:
          # The one and only source this mirror trusts. Hardcoded rather than
          # an input so that a workflow_dispatch caller cannot point the
          # download at an arbitrary repository.
          SOURCE_REPO: amitwh/GitHubDesktopLinux
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail

          if ! echo "$VERSION" | grep -qE '^[0-9]+(\.[0-9]+)*(-[A-Za-z0-9.]+)?$'; then
            echo "::error::Invalid version '${VERSION}'"
            exit 1
          fi

          API="https://api.github.com/repos/${SOURCE_REPO}/releases/tags/v${VERSION}"
          RELEASE=$(curl -fsSL --retry 5 --retry-all-errors "$API")
          mkdir -p packages tmp

          COUNT=$(printf '%s' "$RELEASE" | jq '.assets | length')
          if [ "$COUNT" -eq 0 ]; then
            echo "::error::Source release v${VERSION} in ${SOURCE_REPO} has no assets"
            exit 1
          fi

          # For each asset: fetch the bytes to a temporary file, check the
          # sha256 digest the API published for it, and only then move it
          # into place under a name derived from the API's asset name (not
          # from the download URL).
          printf '%s' "$RELEASE" | jq -r '
            .assets[]
            | [.name, .browser_download_url, .digest] | @tsv
          ' > assets.tsv

          while IFS=$'\t' read -r NAME URL DIGEST; do
            if ! echo "$NAME" | grep -qE '^[A-Za-z0-9._+-]+\.(deb|AppImage|snap|flatpak|exe|msi|nupkg)$'; then
              echo "::error::Refusing asset with unexpected name '${NAME}'"
              exit 1
            fi
            if ! echo "$URL" | grep -qE '^https://(github\.com|release-assets\.githubusercontent\.com)/'; then
              echo "::error::Refusing asset with unexpected download host '${URL}'"
              exit 1
            fi
            case "$DIGEST" in
              sha256:*)
                EXPECTED="${DIGEST#sha256:}"
                ;;
              *)
                echo "::error::Asset '${NAME}' has no sha256 digest; refusing to publish it unverified"
                exit 1
                ;;
            esac

            echo "Fetching ${NAME}"
            curl -fsSL --retry 5 --retry-all-errors -o "tmp/${NAME}" "$URL"
            ACTUAL=$(sha256sum "tmp/${NAME}" | cut -d' ' -f1)
            if [ "$ACTUAL" != "$EXPECTED" ]; then
              echo "::error::Digest mismatch for ${NAME}: expected ${EXPECTED}, got ${ACTUAL}"
              exit 1
            fi
            mv "tmp/${NAME}" "packages/${NAME}"
            echo "Verified ${NAME} (sha256 ${ACTUAL})"
          done < assets.tsv

          # The release notes are written to a file and passed to the action
          # as a path, so nothing from the source release is ever evaluated
          # as an expression or a shell command.
          printf '%s' "$RELEASE" | jq -r '.body // ""' > notes.md

          ls -la packages

      # The release action replaces an asset by deleting it and re-uploading
      # under the same name, but the release-asset API is eventually
      # consistent: the re-upload can still see the asset that is being
      # deleted and fail with "already_exists". Deleting the assets this run
      # will publish up front, and giving the change a moment to propagate,
      # means the upload never races a pending delete — so re-mirroring a
      # version works.
      - name: Remove superseded assets
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          TAG: v${{ inputs.version }}
        run: |
          set -euo pipefail

          if ! RELEASE_ID=$(gh api "repos/${REPO}/releases/tags/${TAG}" --jq .id 2>/dev/null); then
            echo "No existing release ${TAG} — nothing to clean up"
            exit 0
          fi

          for FILE in packages/*; do
            [ -e "$FILE" ] || continue
            NAME=$(basename "$FILE")
            ID=$(gh api "repos/${REPO}/releases/${RELEASE_ID}/assets" \
              --jq ".[] | select(.name == \"${NAME}\") | .id" || true)
            if [ -n "$ID" ]; then
              echo "Deleting superseded asset ${NAME}"
              gh api --method DELETE "repos/${REPO}/releases/assets/${ID}"
            fi
          done

          # Let the deletions land before the upload.
          sleep 20

      - name: Publish the mirror release
        uses: softprops/action-gh-release@e7a8f85e1c67a31e6ed99a94b41bd0b71bbee6b8 # v2.0.9
        with:
          token: ${{ github.token }}
          tag_name: v${{ inputs.version }}
          name: GitHub Desktop Linux ${{ inputs.version }}
          body_path: notes.md
          files: packages/*
          repository: ${{ github.repository }}
          fail_on_unmatched_files: true
          generate_release_notes: false
          draft: false
          prerelease: false
